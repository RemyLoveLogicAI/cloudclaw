name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run test suite (offline, zero deps)
        # Unquoted so bash expands the glob. Node 20 does not glob natively but
        # accepts explicit files; Node 22+ treats a bare directory arg as a
        # module path (ERR_MODULE_NOT_FOUND). Unquoted works on both.
        run: node --test tests/*.test.mjs
